name: Validation fusion Captivia
on:
  push:
    branches: [sync/quentindanblon-main-2026-10-18]
permissions:
  contents: read
concurrency:
  group: sync-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  locks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve combined dependencies
        run: |
          npm --prefix backend install --package-lock-only --ignore-scripts
          npm --prefix frontend install --package-lock-only --ignore-scripts
      - name: Save regenerated locks on the synchronization branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: actualiser les dépendances de la fusion' -m 'Co-authored-by: Amaury Baptist <amaurybaptistecole@gmail.com>'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
  backend:
    needs: locks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: captivia_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d captivia_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/captivia_ci_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
      NOTIFICATIONS_SCHEDULER_ENABLED: 'false'
      REDIS_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
        if: ${{ !cancelled() }}
      - run: npx prisma migrate deploy && npx prisma db seed
        if: ${{ !cancelled() }}
      - run: npm test -- --runInBand
        if: ${{ !cancelled() }}
  frontend:
    needs: locks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}

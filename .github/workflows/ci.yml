name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: captivia_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d captivia_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/captivia_ci_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
      NOTIFICATIONS_SCHEDULER_ENABLED: 'false'
      REDIS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Migrate
        working-directory: backend
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Unit and integration tests
        working-directory: backend
        run: npm test -- --runInBand

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --runInBand

  # Existing lint findings are informational; unlike the old job, this installs
  # the project's ESLint and preserves its real exit code.
  quality:
    name: lint-${{ matrix.directory }} (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        directory: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: ESLint (read-only, no fix)
        working-directory: ${{ matrix.directory }}
        run: npx --no-install eslint "src/**/*.{ts,tsx}" --no-fix
